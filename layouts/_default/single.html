{{ define "main" }}

<section id="main">
  <header>
    <h1 id="title">{{ .Title }}</h1>
    <ul class="frontmatter">
        <li class="date"><time datetime="{{ .Date.Local.Format "2006-01-02" }}">{{- .Date.Local.Format "Mon, 02 Jan 2006 15:04:05 -0700" -}}</time></li>
        <li class="author"><a href="https://twitter.com/{{ .Site.Params.social.twitter | urlize }}" target="_blank">@{{ .Site.Params.social.twitter | html }}</a></li>
        {{ with .Params.tags }}
        <li class="tags">{{ range . -}}
            <span class="tag"><a href="{{ "tags" | absLangURL}}/{{ . | urlize }}">{{ . }}</a></span>
        {{- end }}</li>
        {{ end }}
    </ul>
  </header>
  <article class="article">
    {{ .Content }}
  </article>
</section>

<script>
document.querySelectorAll('.code-copy-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var block = btn.closest('.code-block');
    var code = block.querySelector('pre code') || block.querySelector('pre');
    if (!code) return;
    navigator.clipboard.writeText(code.innerText || code.textContent).then(function() {
      var original = btn.textContent;
      btn.textContent = 'copied!';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1500);
    });
  });
});
</script>

{{ end }}
