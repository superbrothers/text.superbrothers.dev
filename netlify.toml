[build]
  publish = "public"
  command = "hugo --minify"

[build.environment]
  # renovate: datasource=github-releases depName=gohugoio/hugo
  HUGO_VERSION = "0.166.0"
  TZ = "Asia/Tokyo"

[context.production]
  environment = { HUGO_ENV = "production" }

[context.deploy-preview]
  command = "hugo -b $DEPLOY_URL --minify"
